plugins {
    id "com.android.application"
}

android {
    namespace "com.lightchat"
    compileSdk 36
    buildToolsVersion "36.1.0"

    defaultConfig {
        applicationId "com.lightchat"
        minSdk 21
        targetSdk 36
        versionCode 14
        versionName "1.9.2"
        ndk { abiFilters "arm64-v8a" }
    }

    signingConfigs {
        release {
            def props = new Properties()
            def f = rootProject.file("keystore.properties")
            if (f.exists()) {
                f.withInputStream { props.load(it) }
                storeFile rootProject.file(props["storeFile"])
                storePassword props["storePassword"]
                keyAlias props["keyAlias"]
                keyPassword props["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"

    // Lecture vidéo/audio (AndroidX Media3 / ExoPlayer)
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-exoplayer-dash:1.4.1"
    implementation "androidx.media3:media3-ui:1.4.1"

    // Chargement d'images + GIF animés (Glide)
    implementation "com.github.bumptech.glide:glide:4.16.0"
    annotationProcessor "com.github.bumptech.glide:glide:4.16.0"

    // Zoom photo (PhotoView)
    implementation "com.github.chrisbanes:PhotoView:2.3.0"

    // Material Components
    implementation "com.google.android.material:material:1.12.0"

    // Emoji uniformes (EmojiCompat)
    implementation "androidx.emoji2:emoji2:1.5.0"
    implementation "androidx.emoji2:emoji2-bundled:1.5.0"
    implementation "androidx.emoji2:emoji2-views-helper:1.5.0"

    // --- Telegram premium polish (heavy, 200Mo ok) ---
    // Lottie animations premium
    implementation "com.airbnb.android:lottie:6.1.0"

    // Shimmer loading effect (Telegram skeleton)
    implementation "com.facebook.shimmer:shimmer:0.5.0"

    // RecyclerView & CardView (bubbles, lists)
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.cardview:cardview:1.0.0"

    // ConstraintLayout (Telegram complex layouts)
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    // AppCompat (Material3 DayNight requirement)
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core:1.12.0"

    // Lifecycle (ViewModel, LiveData, Runtime)
    implementation "androidx.lifecycle:lifecycle-runtime:2.7.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.7.0"
    implementation "androidx.lifecycle:lifecycle-livedata:2.7.0"
    implementation "androidx.lifecycle:lifecycle-process:2.7.0"

    // Additional polish
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation "androidx.fragment:fragment:1.6.2"
    implementation "androidx.activity:activity:1.8.2"
    implementation "com.google.android.material:material:1.12.0"
}
