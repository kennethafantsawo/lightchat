plugins {
    id "com.android.application"
}

android {
    namespace "com.lightchat"
    compileSdk 36
    buildToolsVersion "36.1.0"

    defaultConfig {
        applicationId "com.lightchat"
        minSdk 21
        targetSdk 36
        versionCode 14
        versionName "1.9.2"
        ndk { abiFilters "arm64-v8a" }
    }

    signingConfigs {
        release {
            def props = new Properties()
            def f = rootProject.file("keystore.properties")
            if (f.exists()) {
                f.withInputStream { props.load(it) }
                storeFile rootProject.file(props["storeFile"])
                storePassword props["storePassword"]
                keyAlias props["keyAlias"]
                keyPassword props["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"

    // Lecture vidéo/audio (AndroidX Media3 / ExoPlayer)
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-exoplayer-dash:1.4.1"
    implementation "androidx.media3:media3-ui:1.4.1"

    // Chargement d'images + GIF animés (Glide)
    implementation "com.github.bumptech.glide:glide:4.16.0"
    annotationProcessor "com.github.bumptech.glide:glide:4.16.0"

    // Zoom photo (PhotoView)
    implementation "com.github.chrisbanes:PhotoView:2.3.0"

    // Material Components
    implementation "com.google.android.material:material:1.12.0"

    // Emoji uniformes (EmojiCompat)
    implementation "androidx.emoji2:emoji2:1.5.0"
    implementation "androidx.emoji2:emoji2-bundled:1.5.0"
    implementation "androidx.emoji2:emoji2-views-helper:1.5.0"
}